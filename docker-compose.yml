
services:

  # -------------------------
  # KAFKA
  # -------------------------
  kafka:
    image: apache/kafka:4.1.2
    container_name: organization-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

    networks:
      - organization-network

  # -------------------------
  # MYSQL
  # -------------------------
  mysql:
    image: mysql:8.4
    container_name: organization-mysql
    ports:
      - "3307:3306"

    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: organization_db
      MYSQL_USER: organization_user
      MYSQL_PASSWORD: organization_password

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - organization-network

  # -------------------------
  # PRODUCER
  # -------------------------
  organization-producer:
    build:
      context: ./producer
      dockerfile: Dockerfile

    image: organization-producer:1.0
    container_name: organization-producer

    ports:
      - "8081:8081"

    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_TOPIC_ORGANIZATION: organization-topic
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/organization_db
      SPRING_DATASOURCE_USERNAME: organization_user
      SPRING_DATASOURCE_PASSWORD: organization_password

    depends_on:
      kafka:
        condition: service_healthy

    networks:
      - organization-network

  # -------------------------
  # CONSUMER
  # -------------------------
  organization-consumer:
    build:
      context: ./consumer
      dockerfile: Dockerfile

    image: organization-consumer:1.0
    container_name: organization-consumer

    ports:
      - "8082:8082"

    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/organization_db?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: organization_user
      SPRING_DATASOURCE_PASSWORD: organization_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy

    networks:
      - organization-network

# -------------------------
# NETWORKS
# -------------------------
networks:
  organization-network:
    driver: bridge

# -------------------------
# VOLUMES
# -------------------------
volumes:
  mysql-data:
