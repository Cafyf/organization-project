server:
  port: 8082

spring:
  application:
    name: organization-consumer

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: organization-consumer-group

      auto-offset-reset: earliest

      enable-auto-commit: false

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer

      properties:
        "[spring.json.value.default.type]": com.kafka.consumer.dto.request.Organization

        "[spring.json.trusted.packages]": com.kafka.consumer.dto

        "[spring.json.use.type.headers]": false

    listener:
      ack-mode: record


  datasource:
    url: jdbc:mysql://localhost:3306/{DB}?useSSL=false&serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

